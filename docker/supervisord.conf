; =============================================================================
; Ouroboros v7.1 — SupervisorD Configuration
; =============================================================================
;
; Manages two processes inside the Docker container:
;   1. triton-worker   — The GPU compute worker (auto-restarts on crash)
;   2. ecc-orchestrator — The ECC autonomous orchestrator (runs to completion)
;
; Usage: supervisord -c /etc/supervisor/conf.d/ouroboros.conf
; =============================================================================

[supervisord]
nodaemon=true
logfile=/var/log/ouroboros/supervisord.log
logfile_maxbytes=50MB
logfile_backups=3
loglevel=info
pidfile=/var/run/supervisord.pid

; ---------------------------------------------------------------------------
; Triton Worker — auto-restarts on SIGSEGV (exit code 139)
; ---------------------------------------------------------------------------
[program:triton-worker]
command=/usr/local/bin/ouroboros-worker
directory=/workspace/ouroboros-triton
autostart=true
autorestart=true
startretries=3
startsecs=5
stopwaitsecs=30
stopsignal=TERM
stdout_logfile=/var/log/ouroboros/worker.stdout.log
stdout_logfile_maxbytes=50MB
stderr_logfile=/var/log/ouroboros/worker.stderr.log
stderr_logfile_maxbytes=50MB
priority=100

; ---------------------------------------------------------------------------
; ECC Orchestrator — runs Phase 0.5 to completion, no auto-restart
; ---------------------------------------------------------------------------
[program:ecc-orchestrator]
command=ecc run --config /workspace/ouroboros-v7/.ecc/config.yaml --phase 0.5 --non-interactive
directory=/workspace/ouroboros-v7
autostart=true
autorestart=false
startsecs=10
stopwaitsecs=60
stdout_logfile=/var/log/ouroboros/ecc.log
stdout_logfile_maxbytes=100MB
stderr_logfile=/var/log/ouroboros/ecc.err.log
stderr_logfile_maxbytes=50MB
environment=OX_ALPHA_API_KEY="%(ENV_OX_ALPHA_API_KEY)s",OX_ALPHA_BASE_URL="%(ENV_OX_ALPHA_BASE_URL)s",OX_ALPHA_MODEL="%(ENV_OX_ALPHA_MODEL)s",ECC_BUDGET="%(ENV_ECC_BUDGET)s"
priority=200
